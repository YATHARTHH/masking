name: Production CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-pipeline:
    name: Build, Test & Verify Pipeline
    runs-on: ubuntu-latest
    steps:
      # ----------------------------------------------------
      # Step 1: Checkout Repository
      # ----------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------
      # Step 2: Secret & Repo Hygiene Scan
      # ----------------------------------------------------
      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Setup Python 3.11 for Repo Hygiene
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pii-masking-backend-main/requirements.txt

      - name: Verify Repo Hygiene (CODEOWNERS & PR Template)
        working-directory: pii-masking-backend-main
        run: |
          python tasks/check_repo_hygiene.py

      # ----------------------------------------------------
      # Step 3: Backend Quality, Testing & Security Audit
      # ----------------------------------------------------
      - name: Install Backend Dependencies
        working-directory: pii-masking-backend-main
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Backend Code Linting & Formatting (Ruff)
        working-directory: pii-masking-backend-main
        run: |
          ruff check .

      - name: Backend Static Security Audit (Bandit)
        working-directory: pii-masking-backend-main
        run: |
          bandit -r src/

      - name: Backend Unit Tests & Coverage (Pytest)
        working-directory: pii-masking-backend-main
        run: |
          pytest -c pyproject.toml --cov=src --cov-report=xml --cov-report=term tests/

      # ----------------------------------------------------
      # Step 4: Frontend Linting, Typing & Production Build
      # ----------------------------------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pii-masking-frontend-master/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: pii-masking-frontend-master
        run: npm ci

      - name: Frontend Linting (ESLint)
        working-directory: pii-masking-frontend-master
        run: npm run lint

      - name: Frontend TypeScript & Vite Production Build
        working-directory: pii-masking-frontend-master
        run: npm run build

      # ----------------------------------------------------
      # Step 5: Container Image Build Verification
      # ----------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Backend Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: pii-masking-backend-main
          file: pii-masking-backend-main/docker/Dockerfile
          push: false
          tags: pii-masking-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: pii-masking-frontend-master
          file: pii-masking-frontend-master/docker/Dockerfile
          push: false
          tags: pii-masking-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
