name: Production CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================
  # 1. SECURITY & HYGIENE SCANNING
  # ==========================================
  security-and-hygiene:
    name: Security & Repo Hygiene Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Setup Python for Audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pii-masking-backend-main/requirements.txt

      - name: Backend Dependency Security Audit (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r pii-masking-backend-main/requirements.txt || true

      - name: Setup Node.js for Audit
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pii-masking-frontend-master/package-lock.json

      - name: Frontend Dependency Security Audit (npm audit)
        working-directory: pii-masking-frontend-master
        run: |
          npm audit --audit-level=high || true

      - name: Verify Repo Hygiene (CODEOWNERS & PR Template)
        working-directory: pii-masking-backend-main
        run: |
          python tasks/check_repo_hygiene.py || true

  # ==========================================
  # 2. BACKEND CI (Python + Pip + Pytest)
  # ==========================================
  backend-ci:
    name: Backend CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    defaults:
      run:
        working-directory: pii-masking-backend-main

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pii-masking-backend-main/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Check Formatting & Code Style (Ruff, Black, Isort)
        run: |
          ruff check .
          black --check --config pyproject.toml .
          isort --check-only --settings-path pyproject.toml .

      - name: Static Type Checking (MyPy)
        run: |
          mypy --config-file pyproject.toml src/

      - name: Security Static Analysis (Bandit)
        run: |
          bandit -r src/

      - name: Run Unit & Integration Tests (Pytest + Coverage)
        run: |
          pytest -c pyproject.toml --cov=src --cov-report=xml --cov-report=term tests/

      - name: Upload Coverage Artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: pii-masking-backend-main/coverage.xml

  # ==========================================
  # 3. FRONTEND CI (React + Vite + TypeScript)
  # ==========================================
  frontend-ci:
    name: Frontend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    defaults:
      run:
        working-directory: pii-masking-frontend-master

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: pii-masking-frontend-master/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Lint Codebase (ESLint)
        run: npm run lint

      - name: TypeScript Typecheck & Production Build (Vite)
        run: npm run build

      - name: Upload Build Output Artifact
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-bundle
          path: pii-masking-frontend-master/dist/

  # ==========================================
  # 4. CONTAINER BUILD VERIFICATION
  # ==========================================
  docker-build:
    name: Docker Container Image Builds
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: pii-masking-backend-main
          file: pii-masking-backend-main/docker/Dockerfile
          push: false
          tags: pii-masking-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: pii-masking-frontend-master
          file: pii-masking-frontend-master/docker/Dockerfile
          push: false
          tags: pii-masking-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 5. UNIFIED STATUS GATEKEEPER
  # ==========================================
  ci-success:
    name: Production CI Quality Gate
    needs: [security-and-hygiene, backend-ci, frontend-ci, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All CI Jobs Succeeded
        run: |
          SEC_STATUS="${{ needs.security-and-hygiene.result }}"
          BACKEND_STATUS="${{ needs.backend-ci.result }}"
          FRONTEND_STATUS="${{ needs.frontend-ci.result }}"
          DOCKER_STATUS="${{ needs.docker-build.result }}"

          echo "Security Status: $SEC_STATUS"
          echo "Backend Status:  $BACKEND_STATUS"
          echo "Frontend Status: $FRONTEND_STATUS"
          echo "Docker Status:   $DOCKER_STATUS"

          if [ "$SEC_STATUS" = "failure" ] || [ "$BACKEND_STATUS" = "failure" ] || [ "$FRONTEND_STATUS" = "failure" ] || [ "$DOCKER_STATUS" = "failure" ]; then
            echo "ERROR: One or more CI jobs failed!"
            exit 1
          fi

          echo "All Production CI checks passed successfully!"
