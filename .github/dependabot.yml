version: 2
updates:
  # Backend Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/pii-masking-backend-main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-backend):"

  # Frontend Node.js dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/pii-masking-frontend-master"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-frontend):"

  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci):"

  # Docker Container Images
  - package-ecosystem: "docker"
    directory: "/pii-masking-backend-main/docker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker-backend):"

  - package-ecosystem: "docker"
    directory: "/pii-masking-frontend-master/docker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker-frontend):"
