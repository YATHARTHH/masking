target-version = "py312"
line-length = 100

[lint]
# E/W = pycodestyle, F = pyflakes (unused imports/vars), I = isort,
# UP = pyupgrade, B = bugbear, C4 = comprehensions.
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "B904", "E741"]  # line length, FastAPI default args, exception chaining, single-letter variables
